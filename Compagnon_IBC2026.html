const DAY_LABEL = {11:'Vendredi 11 septembre', 12:'Samedi 12 septembre', 13:'Dimanche 13 septembre'}; const DAY_HOURS = {11:'10:30–18:00', 12:'09:30–18:00', 13:'09:30–18:00'}; const DAY_YEAR = 2026, DAY_MONTH = 8; // September (0-indexed)

let state = { day:'all', onlyFT:false, q:'', cat:null };

const LOC_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s-7-7.2-7-12a7 7 0 1 1 14 0c0 4.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>';

function eventDate(ev){
  const [h,m] = ev.start.split(':').map(Number);
  return new Date(DAY_YEAR, DAY_MONTH, Number(ev.day), h, m); } function endDate(ev){
  if(!ev.end) return eventDate(ev);
  const [h,m] = ev.end.split(':').map(Number);
  return new Date(DAY_YEAR, DAY_MONTH, Number(ev.day), h, m); }

// ---------- category chips ----------
const CAT_ORDER = ['Diffusion','Mediaflows','Post-prod','Studios','Personnel','Soirée','Dîner','Général','Train'];
function buildCatRow(){
  const present = new Set();
  EVENTS.forEach(e => e.categories.forEach(c => present.add(c)));
  const row = document.getElementById('catRow');
  const cats = CAT_ORDER.filter(c => present.has(c));
  row.innerHTML = ['<button class="chip on" data-c="">Toutes catégories</button>']
    .concat(cats.map(c => `<button class="chip" data-c="${c}">${c}</button>`)).join('');
  row.querySelectorAll('.chip').forEach(btn => btn.onclick = () => {
    row.querySelectorAll('.chip').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    state.cat = btn.dataset.c || null;
    render();
  });
}

// ---------- day counts ----------
function updateDayCounts(){
  [11,12,13].forEach(d => {
    document.getElementById('n'+d).textContent = EVENTS.filter(e => Number(e.day)===d).length;
  });
}

// ---------- render ----------
function matches(ev){
  if(state.day !== 'all' && ev.day !== state.day) return false;
  if(state.onlyFT && !ev.isFT) return false;
  if(state.cat && !ev.categories.includes(state.cat)) return false;
  if(state.q){
    const hay = (ev.title+' '+ev.loc+' '+ev.categories.join(' ')+' '+ev.note).toLowerCase();
    if(!hay.includes(state.q)) return false;
  }
  return true;
}

function walkBadge(travel){
  if(!travel || !travel.duration) return '';
  const tight = /1[5-9]|2\d/.test(travel.duration) || /traversée/i.test(travel.note||'');
  return `<div class="walk"><span class="walk-line"></span><span class="walk-badge ${tight?'tight':''}">🚶 ${travel.duration}${travel.note ? ' · '+travel.note : ''}</span></div>`; }

function cardHTML(ev, idx, isPast){
  const isSocial = ev.categories.includes('Soirée') || ev.categories.includes('Dîner');
  const kindClass = [
    ev.isTrain ? 'train' : '',
    ev.isFT ? 'ft' : '',
    isSocial ? 'social' : ''
  ].filter(Boolean).join(' ');
  const icon = ev.isTrain ? '🚆 ' : (isSocial ? '🍸 ' : '');
  return `
  <div class="item ${kindClass} ${isPast?'past':''}" data-idx="${idx}">
    <div class="marker"><span class="mdate">${ev.dateShort}</span><b>${ev.start}</b><small>${ev.end ? '– '+ev.end : ''}</small></div>
    ${ev.travel ? walkBadge(ev.travel) : ''}
    <button class="card" onclick="openSheet(${idx})">
      <div class="card-top">
        <div class="card-top-main">
          <h3>${icon}${escapeHtml(ev.title)}</h3>
        </div>
        ${ev.isFT ? '<span class="ftbadge">FT</span>' : ''}
      </div>
      <p class="loc">${LOC_ICON} ${escapeHtml(ev.loc)}</p>
      <div class="tags">${ev.categories.map(c=>`<span class="tag">${c}</span>`).join('')}</div>
      ${ev.note ? `<p class="note">${escapeHtml(ev.note)}</p>` : ''}
    </button>
  </div>`;
}

function escapeHtml(s){
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function render(){
  const now = new Date();
  const days = state.day === 'all' ? ['11','12','13'] : [state.day];
  let n=0, p=0;
  let html = '';
  days.forEach(d => {
    const items = EVENTS.map((e,i)=>({e,i})).filter(x => x.e.day===d && matches(x.e));
    if(!items.length) return;
    n += items.length;
    p += items.filter(x=>x.e.isFT).length;
    html += `<div class="daygroup"><h2>${DAY_LABEL[d]}<span class="line"></span><span class="dayhours">Salon ouvert ${DAY_HOURS[d]}</span></h2><div class="rail">`;
    items.forEach(({e,i}) => {
      const past = endDate(e) < now;
      html += cardHTML(e, i, past);
    });
    html += `</div></div>`;
  });
  document.getElementById('timeline').innerHTML = html;
  document.getElementById('N').textContent = n;
  document.getElementById('P').textContent = p;
  document.getElementById('emptyState').classList.toggle('hidden', n>0); }

// ---------- sheet ----------
function openSheet(idx){
  const e = EVENTS[idx];
  const modal = document.getElementById('modal');
  modal.innerHTML = `<div class="panel">
    <div class="handle"></div>
    ${e.isFT ? '<span class="pft">Rendez-vous FT</span>' : ''}
    <h2>${e.isTrain?'🚆 ':(e.categories.includes('Soirée')||e.categories.includes('Dîner')?'🍸 ':'')}${escapeHtml(e.title)}</h2>
    <p class="when">${e.dayLabel} · ${e.start}${e.end?' – '+e.end:''}</p>
    <div class="block">
      <div class="lbl">Lieu</div>
      <div class="val">${escapeHtml(e.loc)}</div>
    </div>
    ${e.categories.length ? `<div class="block"><div class="lbl">Catégorie</div><div class="tags">${e.categories.map(c=>`<span class="tag">${c}</span>`).join('')}</div></div>` : ''}
    ${e.note ? `<div class="block"><div class="lbl">Note</div><div class="val">${escapeHtml(e.note)}</div></div>` : ''}
    ${e.travel ? `<div class="block"><div class="lbl">Trajet à pied</div><div class="walkblock"><b>${e.travel.duration}</b> depuis ${escapeHtml(e.travel.from)}${e.travel.note?' · '+e.travel.note:''}</div></div>` : ''}
    <div class="actions">
      <button class="btn-ghost" onclick="copyInfo(${idx})">Copier</button>
      <button class="btn-primary" onclick="closeSheet()">Fermer</button>
    </div>
  </div>`;
  modal.classList.add('on');
}
function closeSheet(){ document.getElementById('modal').classList.remove('on'); } function copyInfo(idx){
  const e = EVENTS[idx];
  const txt = `${e.title}\n${e.dayLabel} · ${e.start}${e.end?'–'+e.end:''}\n${e.loc}`;
  if(navigator.clipboard) navigator.clipboard.writeText(txt).catch(()=>{});
}

// ---------- countdown ----------
function tick(){
  const now = new Date();
  let next = null;
  EVENTS.forEach(e => {
    if(!(e.isFT || e.isTrain)) return;
    const at = eventDate(e);
    if(at > now && (!next || at < next.at)) next = {at, e};
  });
  const box = document.getElementById('nextBox');
  if(!next){
    box.classList.add('done');
    document.getElementById('nextTitle').textContent = 'Agenda terminé';
    document.getElementById('nextWhen').textContent = 'Aucun rendez-vous à venir';
    ['cdD','cdH','cdM','cdS'].forEach(id=>document.getElementById(id).textContent = id==='cdD'?'0':'00');
    return;
  }
  box.classList.remove('done');
  document.getElementById('nextTitle').textContent = (next.e.isTrain?'🚆 ':'') + next.e.title;
  document.getElementById('nextWhen').textContent = `${next.e.dayLabel} · ${next.e.start} · ${next.e.loc}`;
  let s = Math.max(0, Math.floor((next.at-now)/1000));
  const d = Math.floor(s/86400); s%=86400;
  const h = Math.floor(s/3600); s%=3600;
  const m = Math.floor(s/60); s%=60;
  document.getElementById('cdD').textContent = d;
  document.getElementById('cdH').textContent = String(h).padStart(2,'0');
  document.getElementById('cdM').textContent = String(m).padStart(2,'0');
  document.getElementById('cdS').textContent = String(s).padStart(2,'0'); }
